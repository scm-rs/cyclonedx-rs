name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: read

jobs:
  common:
    uses: scm-rs/shared-workflows/.github/workflows/ci.yaml@main
    with:
      # The renamed package has no same-identity registry baseline yet.
      preflight_semver_exclude: cyclonedx-rs

  ci:
    runs-on: ubuntu-latest
    needs:
      - common
    if: always()
    steps:
      - name: Success
        if: ${{ needs.common.result == 'success' }}
        run: exit 0
      - name: Failure
        if: ${{ needs.common.result != 'success' }}
        run: exit 1

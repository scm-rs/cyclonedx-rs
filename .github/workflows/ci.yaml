name: CI

on:
  push:
    branches: [main, prepare/cyclonedx-rs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No registry baseline exists for this renamed, unpublished package.
# First-release semver comparison is deferred, not build/test/package checks.
# Adopt shared CI after a same-identity baseline is agreed (see README).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        rust: [stable, '1.91.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ matrix.rust }} check --all-targets --all-features --locked
      - run: cargo +${{ matrix.rust }} test --all-features --locked
      - run: cargo +${{ matrix.rust }} clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} fmt --all -- --check

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable package --list --locked
      - run: cargo +stable package --locked
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: python3 ci/verify-package.py

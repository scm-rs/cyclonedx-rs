[package]
name = "cyclonedx-rs"
version = "0.10.1"
rust-version = "1.91.0"
authors = ["Paul Sastrasinh <psastras@gmail.com>"]
edition = "2021"
description = "Serde serialization for CycloneDx files"
# Library code is MIT; the archive also includes Apache-2.0 schemas.
license = "MIT AND Apache-2.0"
readme = "README.md"
keywords = ["cyclonedx", "sbom", "serde", "serialization"]
categories = ["encoding"]
build = "build.rs"
homepage = "https://github.com/scm-rs/cyclonedx-rs"
documentation = "https://docs.rs/cyclonedx-rs"
repository = "https://github.com/scm-rs/cyclonedx-rs"
include = ["Cargo.toml", "Cargo.lock", "build.rs", "src/**", "schemas/**", "LICENSE", "LICENSE-APACHE", "NOTICE", "README.md", "tests/**", ".rustfmt.toml"]

[badges]
github = { repository = "scm-rs/cyclonedx-rs" }

[features]
default = []

[dependencies]
anyhow = "1.0.102"
derive_builder = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
pretty_assertions = "1.4.1"

[build-dependencies]
anyhow = "1.0.102"
prettyplease = "0.3.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
schemafy_lib = "0.6.0"
serde_json = "1.0.150"
syn = "2.0.117"
